<script>
  // ─── Supabase Init ───
  const SUPABASE_URL = "https://clbphhpprujjpdopfgtq.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYnBoaHBwcnVqanBkb3BmZ3RxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTQwMzgsImV4cCI6MjA5NTM3MDAzOH0.udmaLNyKJodWU7oIHaEbsXdqxZ1Rqz-7CwLai2_6ahU";
  let _supabase = null;
  try {
    if (window.supabase) {
      _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch (err) {
    console.error("Failed to initialize Supabase:", err);
  }

  // ─── Form Handler ───
  const form = document.getElementById('signup-form');
  const errorEl = document.getElementById('signup-error');
  const btnEl = document.getElementById('signup-btn');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('visible');
  }
  function hideError() {
    errorEl.classList.remove('visible');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    if (!_supabase) {
      showError('Unable to connect to the server. Please check your internet connection or disable adblockers.');
      return;
    }

    const username = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const school = document.getElementById('school').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;

    // Client-side validations
    if (!username || !email || !school || !password) {
      showError('Please fill in all fields.');
      return;
    }
    if (password !== confirmPassword) {
      showError('Passwords do not match.');
      return;
    }
    if (password.length < 6) {
      showError('Password must be at least 6 characters.');
      return;
    }

    // Disable button & show spinner
    const originalHTML = btnEl.innerHTML;
    btnEl.disabled = true;
    btnEl.innerHTML = '<span class="spinner"></span> Creating Account...';

    try {
      // 1. Sign up with Supabase Auth
      const { data, error: signUpError } = await _supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          data: { username: username, school: school }
        }
      });

      if (signUpError) {
        showError(signUpError.message);
        btnEl.disabled = false;
        btnEl.innerHTML = originalHTML;
        return;
      }

      // 2. Insert profile row
      const user = data.user;
      if (user) {
        const { error: profileError } = await _supabase
          .from('profiles')
          .insert({
            id: user.id,
            username: username,
            school: school,
            total_points: 0
          });

        if (profileError) {
          console.warn('Profile insert error (may already exist via trigger):', profileError.message);
        }
      }

      // 3. Redirect to login
      alert('Account created! Please log in.');
      window.location.href = 'login.html';

    } catch (err) {
      showError('An unexpected error occurred. Please try again.');
      console.error(err);
      btnEl.disabled = false;
      btnEl.innerHTML = originalHTML;
    }
  });
</script>
