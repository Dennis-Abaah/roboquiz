<script>
  // ─── Supabase Init ───
  const SUPABASE_URL = "https://clbphhpprujjpdopfgtq.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYnBoaHBwcnVqanBkb3BmZ3RxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTQwMzgsImV4cCI6MjA5NTM3MDAzOH0.udmaLNyKJodWU7oIHaEbsXdqxZ1Rqz-7CwLai2_6ahU";
  let _supabase = null;
  try {
    if (window.supabase) {
      _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch (err) {
    console.error("Failed to initialize Supabase:", err);
  }

  const podiumSection = document.getElementById('podium-section');
  const listSection = document.getElementById('list-section');

  // Avatar color palette for initials
  const AVATAR_COLORS = [
    { bg: 'bg-primary-container', text: 'text-on-primary-container' },
    { bg: 'bg-tertiary-container', text: 'text-on-tertiary-container' },
    { bg: 'bg-secondary-container', text: 'text-on-secondary-container' },
  ];

  function getInitials(name) {
    return name.split(' ').map(w => w[0]).join('').toUpperCase().substring(0, 2);
  }

  // ─── Render Leaderboard ───
  function renderLeaderboard(profiles) {
    if (!profiles || profiles.length === 0) {
      podiumSection.innerHTML = '<p class="text-center text-on-surface-variant font-body-lg col-span-full">No students yet!</p>';
      return;
    }

    // Sort by total_points descending
    profiles.sort((a, b) => b.total_points - a.total_points);

    const top3 = profiles.slice(0, 3);
    const rest = profiles.slice(3);

    // ─── Podium ───
    const podiumConfigs = [
      { rank: 2, order: 'order-2 md:order-1', width: 'w-full md:w-1/4', mt: '', color: '#C0C0C0', label: '2ND', imgSize: 'w-20 h-20', gradient: 'from-white to-[#f0f0f0]', borderColor: 'border-outline-variant' },
      { rank: 1, order: 'order-1 md:order-2', width: 'w-full md:w-1/3', mt: '-mt-lg md:-mt-xl z-20', color: '#fec700', label: '1ST', imgSize: 'w-24 h-24', gradient: 'from-[#ffe066] to-[#fec700]', borderColor: 'border-secondary', isStar: true },
      { rank: 3, order: 'order-3 md:order-3', width: 'w-full md:w-1/4', mt: '', color: '#CD7F32', label: '3RD', imgSize: 'w-20 h-20', gradient: 'from-white to-[#fdf5eb]', borderColor: 'border-[#CD7F32]' },
    ];

    podiumSection.innerHTML = '';

    podiumConfigs.forEach((cfg) => {
      const idx = cfg.rank - 1;
      if (!top3[idx]) return;
      const p = top3[idx];
      const initials = getInitials(p.username);

      const bgClass = cfg.rank === 1 ? 'bg-secondary-container' : 'bg-surface-container-lowest';
      const textClass = cfg.rank === 1 ? 'text-on-secondary-container' : '';

      const div = document.createElement('div');
      div.className = `flex flex-col items-center ${cfg.order} ${cfg.width} ${cfg.mt}`;
      div.innerHTML = `
        <div class="${bgClass} ambient-shadow rounded-xl p-md flex flex-col items-center w-full border-2 ${cfg.borderColor} relative pb-xl tactile-button bg-gradient-to-b ${cfg.gradient}">
          <div class="absolute -top-${cfg.rank === 1 ? '8' : '6'} bg-[${cfg.color}] text-white font-label-bold text-label-bold px-${cfg.rank === 1 ? '6' : '4'} py-${cfg.rank === 1 ? '2' : '1'} rounded-full shadow-${cfg.rank === 1 ? 'lg' : 'md'} border-2 border-white flex items-center gap-1">
            ${cfg.isStar ? '<span class="material-symbols-outlined" data-icon="star">star</span>' : ''}
            ${cfg.label}
          </div>
          <div class="${cfg.imgSize} rounded-full border-4 border-[${cfg.color}] mb-sm flex items-center justify-center font-black text-2xl ${AVATAR_COLORS[idx % 3].bg} ${AVATAR_COLORS[idx % 3].text}">
            ${initials}
          </div>
          <h3 class="font-title-md text-title-md text-center ${textClass} ${cfg.rank === 1 ? 'text-xl' : ''}">${p.username}</h3>
          <p class="font-body-sm text-body-sm ${cfg.rank === 1 ? 'text-on-secondary-fixed-variant' : 'text-on-surface-variant'} mb-2">${p.school}</p>
          <div class="flex items-center gap-1 ${cfg.rank === 1 ? 'bg-white px-4 py-2 rounded-full shadow-sm' : 'bg-[' + (cfg.rank === 2 ? '#f0f0f0' : '#fdf5eb') + '] px-3 py-1 rounded-full'}">
            <span class="material-symbols-outlined text-[${cfg.color}]" data-icon="emoji_events">emoji_events</span>
            <span class="font-label-bold text-label-bold ${cfg.rank === 1 ? 'text-on-secondary-container' : ''}">${p.total_points.toLocaleString()} pts</span>
          </div>
        </div>
      `;
      podiumSection.appendChild(div);
    });

    // ─── List (rank 4+) ───
    // Keep header row
    const headerRow = listSection.querySelector('.hidden.md\\:flex');
    listSection.innerHTML = '';
    if (headerRow) listSection.appendChild(headerRow);

    rest.forEach((p, i) => {
      const rank = i + 4;
      const initials = getInitials(p.username);
      const colorSet = AVATAR_COLORS[rank % 3];

      const row = document.createElement('div');
      row.className = 'flex items-center justify-between bg-surface-container-low hover:bg-surface-variant transition-colors p-3 rounded-lg border border-transparent hover:border-outline-variant cursor-pointer';
      row.innerHTML = `
        <div class="w-12 md:w-16 text-center font-title-md text-title-md text-on-surface-variant">${rank}</div>
        <div class="flex items-center gap-3 flex-grow pl-2 md:pl-4">
          <div class="w-10 h-10 rounded-full ${colorSet.bg} ${colorSet.text} flex items-center justify-center font-label-bold text-label-bold">${initials}</div>
          <span class="font-body-lg text-body-lg font-bold">${p.username}</span>
        </div>
        <div class="hidden md:block w-1/3 text-on-surface-variant font-body-sm text-body-sm">${p.school}</div>
        <div class="w-24 text-right font-label-bold text-label-bold text-primary flex items-center justify-end gap-1">
          ${p.total_points.toLocaleString()}
          <span class="material-symbols-outlined text-sm text-secondary-container" data-icon="stars">stars</span>
        </div>
      `;
      listSection.appendChild(row);
    });

    // If no entries beyond top 3
    if (rest.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'text-center py-4 text-on-surface-variant font-body-sm';
      empty.textContent = 'More students coming soon!';
      listSection.appendChild(empty);
    }
  }

  // ─── Auth Guard + Initial Load + Real-Time ───
  (async function init() {
    if (!_supabase) return;
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    // Initial fetch
    const { data: profiles } = await _supabase
      .from('profiles')
      .select('username, school, total_points')
      .order('total_points', { ascending: false });

    renderLeaderboard(profiles || []);

    // ─── Real-Time Subscription ───
    _supabase
      .channel('leaderboard-realtime')
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'profiles'
      }, async () => {
        // Re-fetch and re-render on any profiles change
        const { data: updated } = await _supabase
          .from('profiles')
          .select('username, school, total_points')
          .order('total_points', { ascending: false });

        renderLeaderboard(updated || []);

        // Subtle pulse animation
        podiumSection.classList.add('pulse');
        setTimeout(() => podiumSection.classList.remove('pulse'), 400);
      })
      .subscribe();
  })();
</script>
