<script>
  // ─── Supabase Init ───
  const SUPABASE_URL = "https://clbphhpprujjpdopfgtq.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYnBoaHBwcnVqanBkb3BmZ3RxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTQwMzgsImV4cCI6MjA5NTM3MDAzOH0.udmaLNyKJodWU7oIHaEbsXdqxZ1Rqz-7CwLai2_6ahU";
  let _supabase = null;
  try {
    if (window.supabase) {
      _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch (err) {
    console.error("Failed to initialize Supabase:", err);
  }

  // ─── Color mapping for quiz categories ───
  const CATEGORY_STYLES = {
    'EV3': { bg: '#1cb0f6', border: '#006590', icon: 'settings', iconColor: 'text-white' },
    'Spike': { bg: '#ff6b8b', border: '#d6335a', icon: 'code', iconColor: 'text-white' },
    'Whalesbot': { bg: '#fec700', border: '#d4a000', icon: 'smart_toy', iconColor: 'text-on-secondary-container' }
  };

  // ─── Auth Guard + Data Load ───
  (async function init() {
    if (!_supabase) return;

    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    const userId = session.user.id;

    // Fetch user profile
    const { data: profile } = await _supabase
      .from('profiles')
      .select('username, total_points')
      .eq('id', userId)
      .single();

    if (profile) {
      document.getElementById('welcome-name').textContent = `Hi, ${profile.username}!`;
      document.getElementById('user-points').textContent = profile.total_points.toLocaleString();
    }

    // Fetch quizzes
    const { data: quizzes, error } = await _supabase
      .from('quizzes')
      .select('id, category, title, description')
      .order('created_at', { ascending: false });

    const grid = document.getElementById('quiz-grid');
    grid.innerHTML = ''; // Clear skeleton

    if (!quizzes || quizzes.length === 0) {
      grid.innerHTML = `
        <div class="col-span-full text-center py-xl">
          <span class="material-symbols-outlined text-6xl text-outline-variant mb-4 block">quiz</span>
          <p class="font-title-md text-title-md text-on-surface-variant">No quizzes available yet.</p>
          <p class="font-body-sm text-body-sm text-outline mt-2">Check back soon or ask your teacher!</p>
        </div>`;
      return;
    }

    // Fetch user's completed submissions to mark quizzes
    const { data: submissions } = await _supabase
      .from('submissions')
      .select('quiz_id')
      .eq('user_id', userId);

    const answeredQuizIds = new Set((submissions || []).map(s => s.quiz_id));

    quizzes.forEach((quiz) => {
      const style = CATEGORY_STYLES[quiz.category] || CATEGORY_STYLES['EV3'];
      const hasAnswered = answeredQuizIds.has(quiz.id);

      const card = document.createElement('div');
      card.className = `bg-[${style.bg}] rounded-3xl p-1 pb-4 flex flex-col h-full relative overflow-hidden tactile-btn border-[${style.border}]`;
      card.style.backgroundColor = style.bg;
      card.style.borderColor = style.border;

      card.innerHTML = `
        ${hasAnswered ? `
        <div class="absolute top-3 right-3 bg-tertiary-container text-on-tertiary-container rounded-full p-1 shadow-sm z-10">
          <span class="material-symbols-outlined text-sm font-bold" data-icon="check">check</span>
        </div>` : ''}
        <div class="h-32 flex items-center justify-center relative">
          <span class="material-symbols-outlined text-6xl ${style.iconColor} opacity-80" data-icon="${style.icon}">${style.icon}</span>
        </div>
        <div class="bg-surface-container-lowest rounded-2xl p-md flex-1 flex flex-col justify-between mt-auto">
          <div>
            <h3 class="font-title-md text-title-md text-on-surface mb-2">${quiz.category}: ${quiz.title}</h3>
            <p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-2">${quiz.description || 'Test your knowledge!'}</p>
          </div>
          <button onclick="window.location.href='quiz.html?id=${quiz.id}'" class="mt-md w-full bg-surface-container-lowest text-on-surface font-label-bold text-label-bold py-3 rounded-xl border-2 border-surface-variant tactile-btn border-b-surface-dim hover:bg-surface-container transition-colors uppercase tracking-widest">
            ${hasAnswered ? 'Review Quiz' : 'Start Quiz'}
          </button>
        </div>`;

      grid.appendChild(card);
    });
  })();
</script>
