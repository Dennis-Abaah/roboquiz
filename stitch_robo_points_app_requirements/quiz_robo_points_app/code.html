<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RoboPulse - RoboQuiz</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .btn-primary-tactile {
            box-shadow: 0 4px 0 0 #00405d;
        }
        .btn-primary-tactile:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 #00405d;
        }
        .btn-secondary-tactile {
            box-shadow: 0 4px 0 0 #bdc8d2;
        }
        .btn-secondary-tactile:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 #bdc8d2;
        }
        .choice-button {
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 0 #e4e2e2;
        }
        .choice-button:hover {
            background-color: #f5f3f3;
            border-color: #006590;
        }
        .choice-button.selected {
            border-color: #006590;
            background-color: #c8e6ff;
            box-shadow: 0 4px 0 0 #004c6e;
        }
        .progress-sheen {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            animation: sheen 3s infinite;
        }
        @keyframes sheen {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#2b6c00",
                    "on-secondary-fixed": "#241a00",
                    "secondary-fixed": "#ffdf92",
                    "on-background": "#1b1c1c",
                    "surface-bright": "#fbf9f8",
                    "outline-variant": "#bdc8d2",
                    "surface-tint": "#006590",
                    "surface": "#fbf9f8",
                    "on-primary-fixed": "#001e2e",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed": "#c8e6ff",
                    "on-tertiary-fixed": "#082100",
                    "tertiary-fixed-dim": "#6be026",
                    "surface-container-low": "#f5f3f3",
                    "on-surface": "#1b1c1c",
                    "on-secondary-container": "#6e5400",
                    "on-surface-variant": "#3e4850",
                    "tertiary-fixed": "#87fe45",
                    "on-tertiary": "#ffffff",
                    "surface-container": "#efeded",
                    "primary-fixed-dim": "#88ceff",
                    "inverse-surface": "#303030",
                    "inverse-on-surface": "#f2f0f0",
                    "tertiary-container": "#51bd00",
                    "on-secondary": "#ffffff",
                    "background": "#fbf9f8",
                    "surface-container-high": "#eae8e7",
                    "on-tertiary-container": "#194500",
                    "primary": "#006590",
                    "on-primary-container": "#00405d",
                    "primary-container": "#1cb0f6",
                    "secondary": "#755b00",
                    "on-primary": "#ffffff",
                    "surface-dim": "#dbd9d9",
                    "secondary-fixed-dim": "#f4bf00",
                    "on-tertiary-fixed-variant": "#1f5100",
                    "on-secondary-fixed-variant": "#594400",
                    "surface-container-highest": "#e4e2e2",
                    "error-container": "#ffdad6",
                    "surface-variant": "#e4e2e2",
                    "outline": "#6e7881",
                    "on-primary-fixed-variant": "#004c6e",
                    "secondary-container": "#fec700",
                    "on-error-container": "#93000a",
                    "on-error": "#ffffff",
                    "error": "#ba1a1a",
                    "inverse-primary": "#88ceff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "container-max": "1200px",
                    "xl": "48px",
                    "gutter": "16px",
                    "lg": "32px",
                    "md": "24px",
                    "base": "8px",
                    "sm": "12px"
            },
            "fontFamily": {
                    "headline-lg": ["Plus Jakarta Sans"],
                    "label-bold": ["Plus Jakarta Sans"],
                    "body-lg": ["Plus Jakarta Sans"],
                    "headline-lg-mobile": ["Plus Jakarta Sans"],
                    "display-lg": ["Plus Jakarta Sans"],
                    "title-md": ["Plus Jakarta Sans"],
                    "body-sm": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "headline-lg": ["24px", {"lineHeight": "1.3", "fontWeight": "800"}],
                    "label-bold": ["14px", {"lineHeight": "1.0", "fontWeight": "800"}],
                    "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "500"}],
                    "headline-lg-mobile": ["20px", {"lineHeight": "1.3", "fontWeight": "800"}],
                    "display-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "title-md": ["18px", {"lineHeight": "1.4", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-lg overflow-x-hidden">
<!-- Top Navigation Header (Suppressed for focused Quiz mode, but keeping branding per anchor) -->
<header class="bg-surface border-b-4 border-outline-variant flex justify-between items-center w-full px-gutter py-3 sticky top-0 z-50">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-xl hover:bg-surface-container-high transition-colors" onclick="window.history.back()">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
<span class="font-black text-primary text-headline-lg-mobile md:text-headline-lg tracking-tight">RoboPulse</span>
</div>
<div class="flex items-center gap-2 bg-secondary-container text-on-secondary-container px-3 py-1 rounded-full font-label-bold">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
<span>Level 12</span>
</div>
</header>
<main class="flex-grow flex flex-col items-center px-gutter pt-8 pb-32 max-w-[800px] mx-auto w-full">
<!-- Progress Section -->
<div class="w-full mb-8">
<div class="flex justify-between items-end mb-3">
<span class="font-headline-lg-mobile md:font-headline-lg text-primary">Question 3 of 10</span>
<span class="font-label-bold text-on-surface-variant mb-1">30% Complete</span>
</div>
<div class="h-5 w-full bg-surface-container rounded-full overflow-hidden border-2 border-outline-variant relative">
<div class="h-full bg-tertiary-container rounded-full w-[30%] relative overflow-hidden transition-all duration-500 ease-out border-r-2 border-on-tertiary-container">
<div class="absolute inset-0 progress-sheen"></div>
</div>
</div>
</div>
<!-- Question Card -->
<div class="w-full bg-surface-container-lowest rounded-[24px] border-2 border-outline-variant p-md md:p-lg mb-8 shadow-[0_20px_40px_rgba(0,0,0,0.08)]">
<div class="flex items-start gap-4 mb-6">
<div class="w-12 h-12 rounded-xl bg-primary-container flex items-center justify-center flex-shrink-0 border-b-4 border-on-primary-container">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">settings_input_component</span>
</div>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-on-surface">
                    What is the primary function of a gear ratio in a robotics system?
                </h2>
</div>
<!-- Asymmetric Image Placeholder for context -->

<!-- Answer Buttons Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<button class="choice-button group flex items-center p-4 rounded-xl border-2 border-outline-variant bg-white text-left active:translate-y-[2px]" onclick="selectChoice(this)">
<span class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center font-black text-on-surface-variant mr-4 border-b-2 border-outline-variant group-hover:bg-primary-container group-hover:text-white transition-colors">A</span>
<span class="font-title-md text-on-surface">To decrease battery consumption</span>
</button>
<button class="choice-button group flex items-center p-4 rounded-xl border-2 border-outline-variant bg-white text-left active:translate-y-[2px]" onclick="selectChoice(this)">
<span class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center font-black text-on-surface-variant mr-4 border-b-2 border-outline-variant group-hover:bg-primary-container group-hover:text-white transition-colors">B</span>
<span class="font-title-md text-on-surface">To change torque and speed</span>
</button>
<button class="choice-button group flex items-center p-4 rounded-xl border-2 border-outline-variant bg-white text-left active:translate-y-[2px]" onclick="selectChoice(this)">
<span class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center font-black text-on-surface-variant mr-4 border-b-2 border-outline-variant group-hover:bg-primary-container group-hover:text-white transition-colors">C</span>
<span class="font-title-md text-on-surface">To stabilize sensor input</span>
</button>
<button class="choice-button group flex items-center p-4 rounded-xl border-2 border-outline-variant bg-white text-left active:translate-y-[2px]" onclick="selectChoice(this)">
<span class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center font-black text-on-surface-variant mr-4 border-b-2 border-outline-variant group-hover:bg-primary-container group-hover:text-white transition-colors">D</span>
<span class="font-title-md text-on-surface">To provide wireless connectivity</span>
</button>
</div>
</div>
<!-- Feedback Area (Hidden by default) -->
<div class="hidden w-full p-4 rounded-2xl bg-tertiary-container text-on-tertiary-container mb-8 border-b-4 border-on-tertiary-container flex items-center gap-4" id="feedback-panel">
<div class="w-10 h-10 rounded-full bg-white flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-tertiary">check_circle</span>
</div>
<div>
<p class="font-label-bold uppercase tracking-wider">Nicely Done!</p>
<p class="text-body-sm">Gear ratios allow robots to trade speed for power or vice versa!</p>
</div>
</div>
</main>
<!-- Fixed Action Bar -->
<footer class="fixed bottom-0 left-0 w-full bg-surface border-t-2 border-outline-variant p-4 z-50">
<div class="max-w-[800px] mx-auto flex gap-4">
<button class="btn-secondary-tactile bg-white border-2 border-outline-variant text-on-surface-variant font-label-bold px-6 py-4 rounded-xl flex items-center gap-2 hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined">help</span>
<span class="hidden md:inline">Need a Hint?</span>
</button>
<button class="btn-primary-tactile flex-grow bg-primary-container text-on-primary-container border-2 border-on-primary-container font-headline-lg-mobile md:font-headline-lg py-4 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed" id="check-btn" onclick="checkAnswer()">
                CHECK ANSWER
            </button>
</div>
</footer>
<script>
        let selectedOption = null;

        function selectChoice(element) {
            // Remove selection from all others
            const choices = document.querySelectorAll('.choice-button');
            choices.forEach(choice => {
                choice.classList.remove('selected');
                choice.querySelector('span:first-child').classList.remove('bg-primary', 'text-white');
                choice.querySelector('span:first-child').classList.add('bg-surface-container', 'text-on-surface-variant');
            });

            // Add selection to current
            element.classList.add('selected');
            const badge = element.querySelector('span:first-child');
            badge.classList.remove('bg-surface-container', 'text-on-surface-variant');
            badge.classList.add('bg-primary', 'text-white');
            
            selectedOption = element;
            document.getElementById('check-btn').disabled = false;
        }

        function checkAnswer() {
            if (!selectedOption) return;

            const checkBtn = document.getElementById('check-btn');
            const feedbackPanel = document.getElementById('feedback-panel');

            if (checkBtn.innerText === 'CHECK ANSWER') {
                // Mocking correct answer for choice B
                const label = selectedOption.querySelector('span:first-child').innerText;
                
                if (label === 'B') {
                    feedbackPanel.classList.remove('hidden', 'bg-error-container', 'text-on-error-container', 'border-on-error-container');
                    feedbackPanel.classList.add('bg-tertiary-container', 'text-on-tertiary-container', 'border-on-tertiary-container');
                    feedbackPanel.querySelector('p:first-child').innerText = 'Nicely Done!';
                    feedbackPanel.querySelector('.material-symbols-outlined').innerText = 'check_circle';
                    feedbackPanel.querySelector('.material-symbols-outlined').classList.replace('text-error', 'text-tertiary');
                } else {
                    feedbackPanel.classList.remove('hidden', 'bg-tertiary-container', 'text-on-tertiary-container', 'border-on-tertiary-container');
                    feedbackPanel.classList.add('bg-error-container', 'text-on-error-container', 'border-on-error-container');
                    feedbackPanel.querySelector('p:first-child').innerText = 'Not quite...';
                    feedbackPanel.querySelector('.material-symbols-outlined').innerText = 'error';
                    feedbackPanel.querySelector('.material-symbols-outlined').classList.add('text-error');
                }
                
                checkBtn.innerText = 'NEXT QUESTION';
                checkBtn.classList.replace('bg-primary-container', 'bg-tertiary-container');
                checkBtn.classList.replace('border-on-primary-container', 'border-on-tertiary-container');
                checkBtn.style.boxShadow = '0 4px 0 0 #194500';
            } else {
                // Reset or navigate
                location.reload();
            }
        }

        // Initialize button state
        document.getElementById('check-btn').disabled = true;
    </script>
</body></html>
