<body class="bg-surface-container-low text-on-background antialiased selection:bg-primary-container selection:text-on-primary-container">
<main class="min-h-screen flex flex-col items-center justify-center p-gutter relative overflow-hidden">
<!-- Atmospheric background blobs -->
<div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-fixed opacity-40 blur-3xl pointer-events-none"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-secondary-fixed opacity-40 blur-3xl pointer-events-none"></div>
<!-- Login Card -->
<div class="w-full max-w-md bg-surface rounded-xl border-2 border-outline-variant shadow-lg p-md md:p-lg relative z-10 transition-transform duration-300">
<div class="flex flex-col items-center mb-8">
<!-- Mascot / Brand Anchor -->
<div class="w-24 h-24 mb-4 rounded-full bg-surface-variant border-4 border-outline-variant flex items-center justify-center overflow-hidden shadow-sm">
<img alt="RoboQuiz Mascot" class="w-full h-full object-cover" data-alt="A highly rendered, cute 3D cartoon robot mascot head. The robot is primarily glossy white plastic with vibrant blue, yellow, and green accents. It has large, friendly glowing digital eyes and a cheerful smile. The style is reminiscent of high-end educational games. The background is a flat, soft light gray." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJ0euzzTx3zkImCQHhZ8cRY7SCO7QwT9kU1tqI9KI0TgGHjNVW-G3PgzZGQj13gTnE37ADn1Hcvh__Z8F3JnEMnL6PTwDFTWg3F3moQc5y-Fzxhs6vrjxj3NterOl96gcgapdWw8_D22zPB1Y_wKwPyrjebSYOcv5z0Cdt0j2TeJxgXJCo6xZvpZcOw6H8ky8OWOxUltKfjEWcOFDu7K4nC6PqkzXwEFTqhu90lyEYn7_1Wl5OhsLQ0lsI3H4QWatijiNOeQxw810"/>
</div>
<h1 class="font-display-lg text-display-lg text-primary text-center">RoboQuiz</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center mt-2">Ready to power up your brain?</p>
</div>
<form class="space-y-6">
<!-- Name Input -->
<div class="space-y-2">
<label class="block font-label-bold text-label-bold text-on-surface" for="name">Name</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-outline material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<input class="w-full bg-surface-bright text-on-surface font-body-lg text-body-lg rounded-lg border-2 border-outline-variant pl-12 pr-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="name" name="name" placeholder="Enter your hero name" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="block font-label-bold text-label-bold text-on-surface" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-on-primary-fixed-variant transition-colors focus:outline-none focus:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-outline material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">lock</span>
<input class="w-full bg-surface-bright text-on-surface font-body-lg text-body-lg rounded-lg border-2 border-outline-variant pl-12 pr-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="Secret access code" type="password"/>
</div>
</div>
<!-- Login Button with Tactile Depth -->
<button class="w-full mt-8 bg-primary text-on-primary font-label-bold text-label-bold py-4 rounded-lg border-b-[4px] border-on-primary-fixed-variant hover:bg-on-primary-fixed-variant hover:border-on-primary-fixed transition-all active:translate-y-[4px] active:border-b-0 active:mb-[4px] flex items-center justify-center gap-2 outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
        Login <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center font-body-lg text-body-lg text-on-surface-variant">
      New to the crew? 
      <a class="font-label-bold text-label-bold text-primary hover:text-on-primary-fixed-variant transition-colors ml-1 focus:outline-none focus:underline" href="#">Sign Up</a>
</div>
</div>
</main>
<script>
  // Simple interaction to add a little life
  document.addEventListener('DOMContentLoaded', () => {
    const card = document.querySelector('.bg-surface');
    const inputs = document.querySelectorAll('input');
    
    inputs.forEach(input => {
      input.addEventListener('focus', () => {
        card.style.transform = 'translateY(-4px)';
      });
      input.addEventListener('blur', () => {
        card.style.transform = 'translateY(0)';
      });
    });
  });
</script>
