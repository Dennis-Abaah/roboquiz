<script>
  // ─── Supabase Init ───
  const SUPABASE_URL = "https://clbphhpprujjpdopfgtq.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsYnBoaHBwcnVqanBkb3BmZ3RxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTQwMzgsImV4cCI6MjA5NTM3MDAzOH0.udmaLNyKJodWU7oIHaEbsXdqxZ1Rqz-7CwLai2_6ahU";
  let _supabase = null;
  try {
    if (window.supabase) {
      _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch (err) {
    console.error("Failed to initialize Supabase:", err);
  }

  // ─── State ───
  let questions = [];
  let currentIndex = 0;
  let selectedOption = null;
  let selectedElement = null;
  let userId = null;
  let quizId = null;
  let answeredMap = {}; // question_id -> { selected, is_correct }
  let sessionPoints = 0;
  
  let quizStartTime = null;
  let newlyCorrectCount = 0;

  const OPTION_LETTERS = ['A', 'B', 'C', 'D'];

  // ─── DOM refs ───
  const questionText = document.getElementById('question-text');
  const choicesGrid = document.getElementById('choices-grid');
  const progressLabel = document.getElementById('progress-label');
  const progressPercent = document.getElementById('progress-percent');
  const progressBar = document.getElementById('progress-bar');
  const checkBtn = document.getElementById('check-btn');
  const feedbackPanel = document.getElementById('feedback-panel');
  const feedbackIcon = document.getElementById('feedback-icon');
  const feedbackTitle = document.getElementById('feedback-title');
  const feedbackDesc = document.getElementById('feedback-desc');
  const headerPoints = document.getElementById('header-points');

  // ─── Init ───
  (async function init() {
    quizStartTime = Date.now();
    if (!_supabase) return;
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }
    userId = session.user.id;

    // Get quiz ID from URL
    const params = new URLSearchParams(window.location.search);
    quizId = parseInt(params.get('id'));
    if (!quizId) {
      alert('No quiz selected.');
      window.location.href = 'index.html';
      return;
    }

    // Load user points
    const { data: profile } = await _supabase
      .from('profiles')
      .select('total_points')
      .eq('id', userId)
      .single();
    
    if (profile) {
      sessionPoints = profile.total_points;
      headerPoints.textContent = `${sessionPoints} pts`;
    }

    // Load questions for this quiz
    const { data: qData, error } = await _supabase
      .from('questions')
      .select('*')
      .eq('quiz_id', quizId)
      .order('id', { ascending: true });

    if (error || !qData || qData.length === 0) {
      questionText.textContent = 'No questions found for this quiz.';
      checkBtn.style.display = 'none';
      return;
    }
    questions = qData;

    // Load existing submissions (anti-farming)
    const questionIds = questions.map(q => q.id);
    const { data: existingSubs } = await _supabase
      .from('submissions')
      .select('question_id, is_correct')
      .eq('user_id', userId)
      .in('question_id', questionIds);

    if (existingSubs) {
      existingSubs.forEach(sub => {
        answeredMap[sub.question_id] = { is_correct: sub.is_correct };
      });
    }

    renderQuestion();
  })();

  // ─── Render Current Question ───
  function renderQuestion() {
    if (currentIndex >= questions.length) {
      showCompletion();
      return;
    }

    const q = questions[currentIndex];
    const total = questions.length;
    const pct = Math.round(((currentIndex) / total) * 100);

    questionText.textContent = q.question_text;
    progressLabel.textContent = `Question ${currentIndex + 1} of ${total}`;
    progressPercent.textContent = `${pct}% Complete`;
    progressBar.style.width = `${pct}%`;

    // Reset feedback
    feedbackPanel.classList.add('hidden');
    selectedOption = null;
    selectedElement = null;

    // Build choice buttons
    const options = [
      { letter: 'A', text: q.option_a },
      { letter: 'B', text: q.option_b },
      { letter: 'C', text: q.option_c },
      { letter: 'D', text: q.option_d }
    ];

    choicesGrid.innerHTML = '';

    const isAlreadyAnswered = !!answeredMap[q.id];

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'choice-button group flex items-center p-4 rounded-xl border-2 border-outline-variant bg-white text-left active:translate-y-[2px]';
      btn.innerHTML = `
        <span class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center font-black text-on-surface-variant mr-4 border-b-2 border-outline-variant group-hover:bg-primary-container group-hover:text-white transition-colors">${opt.letter}</span>
        <span class="font-title-md text-on-surface">${opt.text}</span>
      `;

      if (isAlreadyAnswered) {
        // Show locked state — mark correct answer
        btn.classList.add('locked');
        if (opt.letter === q.correct_option) {
          btn.classList.add('correct');
          btn.querySelector('span:first-child').classList.remove('bg-surface-container', 'text-on-surface-variant');
          btn.querySelector('span:first-child').classList.add('bg-tertiary-container', 'text-white');
        }
      } else {
        btn.addEventListener('click', () => selectChoice(btn, opt.letter));
      }

      choicesGrid.appendChild(btn);
    });

    if (isAlreadyAnswered) {
      // Already answered — show review state
      checkBtn.textContent = currentIndex < questions.length - 1 ? 'NEXT QUESTION' : 'FINISH QUIZ';
      checkBtn.disabled = false;
      checkBtn.classList.replace('bg-primary-container', 'bg-tertiary-container');
      checkBtn.classList.replace('border-on-primary-container', 'border-on-tertiary-container');
      checkBtn.style.boxShadow = '0 4px 0 0 #194500';
      checkBtn.dataset.mode = 'next';

      // Show feedback for already answered
      feedbackPanel.classList.remove('hidden');
      if (answeredMap[q.id].is_correct) {
        feedbackPanel.className = 'w-full p-4 rounded-2xl mb-8 border-b-4 flex items-center gap-4 bg-tertiary-container text-on-tertiary-container border-on-tertiary-container';
        feedbackTitle.textContent = 'Already Answered — Correct!';
        feedbackIcon.textContent = 'check_circle';
        feedbackIcon.className = 'material-symbols-outlined text-tertiary';
      } else {
        feedbackPanel.className = 'w-full p-4 rounded-2xl mb-8 border-b-4 flex items-center gap-4 bg-error-container text-on-error-container border-on-error-container';
        feedbackTitle.textContent = 'Already Answered — Incorrect';
        feedbackIcon.textContent = 'error';
        feedbackIcon.className = 'material-symbols-outlined text-error';
      }
      feedbackDesc.textContent = `Correct answer: ${q.correct_option}`;
    } else {
      checkBtn.textContent = 'CHECK ANSWER';
      checkBtn.disabled = true;
      checkBtn.classList.remove('bg-tertiary-container', 'border-on-tertiary-container');
      checkBtn.classList.add('bg-primary-container', 'border-on-primary-container');
      checkBtn.style.boxShadow = '0 4px 0 0 #00405d';
      checkBtn.dataset.mode = 'check';
    }
  }

  // ─── Select Choice ───
  function selectChoice(element, letter) {
    // Remove previous selection
    const choices = document.querySelectorAll('.choice-button');
    choices.forEach(choice => {
      choice.classList.remove('selected');
      const badge = choice.querySelector('span:first-child');
      badge.classList.remove('bg-primary', 'text-white');
      badge.classList.add('bg-surface-container', 'text-on-surface-variant');
    });

    // Mark current
    element.classList.add('selected');
    const badge = element.querySelector('span:first-child');
    badge.classList.remove('bg-surface-container', 'text-on-surface-variant');
    badge.classList.add('bg-primary', 'text-white');

    selectedOption = letter;
    selectedElement = element;
    checkBtn.disabled = false;
  }

  // ─── Check/Next Button Handler ───
  checkBtn.addEventListener('click', async () => {
    if (checkBtn.dataset.mode === 'next') {
      currentIndex++;
      renderQuestion();
      return;
    }

    if (!selectedOption) return;

    const q = questions[currentIndex];
    const isCorrect = selectedOption === q.correct_option;

    // Lock all choices
    const choices = document.querySelectorAll('.choice-button');
    choices.forEach(choice => {
      choice.classList.add('locked');
      choice.style.pointerEvents = 'none';
    });

    // Mark correct answer green
    const allBtns = Array.from(choices);
    allBtns.forEach(btn => {
      const letter = btn.querySelector('span:first-child').textContent.trim();
      if (letter === q.correct_option) {
        btn.classList.add('correct');
        btn.querySelector('span:first-child').classList.remove('bg-surface-container', 'text-on-surface-variant', 'bg-primary', 'text-white');
        btn.querySelector('span:first-child').classList.add('bg-tertiary-container', 'text-white');
      }
    });

    // Mark selected incorrect if wrong
    if (!isCorrect && selectedElement) {
      selectedElement.classList.add('incorrect');
      selectedElement.querySelector('span:first-child').classList.remove('bg-primary');
      selectedElement.querySelector('span:first-child').classList.add('bg-error-container');
    }

    // Show feedback
    feedbackPanel.classList.remove('hidden');
    if (isCorrect) {
      feedbackPanel.className = 'w-full p-4 rounded-2xl mb-8 border-b-4 flex items-center gap-4 bg-tertiary-container text-on-tertiary-container border-on-tertiary-container';
      feedbackTitle.textContent = 'Nicely Done!';
      feedbackDesc.textContent = `Correct!`;
      feedbackIcon.textContent = 'check_circle';
      feedbackIcon.className = 'material-symbols-outlined text-tertiary';
    } else {
      feedbackPanel.className = 'w-full p-4 rounded-2xl mb-8 border-b-4 flex items-center gap-4 bg-error-container text-on-error-container border-on-error-container';
      feedbackTitle.textContent = 'Not quite...';
      feedbackDesc.textContent = `The correct answer was ${q.correct_option}.`;
      feedbackIcon.textContent = 'error';
      feedbackIcon.className = 'material-symbols-outlined text-error';
    }

    // Submit to database
    try {
      // Insert submission
      const { error: subError } = await _supabase
        .from('submissions')
        .insert({
          user_id: userId,
          quiz_id: quizId,
          question_id: q.id,
          is_correct: isCorrect
        });

      if (subError) {
        console.error('Submission error:', subError.message);
        // If unique constraint violation, it was already answered
        if (subError.code === '23505') {
          feedbackDesc.textContent = 'Already answered — no points awarded.';
        }
      } else if (isCorrect) {
        newlyCorrectCount++;
      }

      // Mark as answered locally
      answeredMap[q.id] = { is_correct: isCorrect };

    } catch (err) {
      console.error('Error submitting answer:', err);
    }

    // Switch button to NEXT
    checkBtn.textContent = currentIndex < questions.length - 1 ? 'NEXT QUESTION' : 'FINISH QUIZ';
    checkBtn.classList.replace('bg-primary-container', 'bg-tertiary-container');
    checkBtn.classList.replace('border-on-primary-container', 'border-on-tertiary-container');
    checkBtn.style.boxShadow = '0 4px 0 0 #194500';
    checkBtn.dataset.mode = 'next';
  });

  // ─── Show Completion ───
  async function showCompletion() {
    const total = questions.length;
    const correct = Object.values(answeredMap).filter(a => a.is_correct).length;
    
    let earnedPointsText = "0 points earned";

    if (newlyCorrectCount > 0) {
        const timeTakenSeconds = Math.floor((Date.now() - quizStartTime) / 1000);
        
        // Base points: 50 per correct answer
        const basePoints = newlyCorrectCount * 50;
        
        // Time penalty: 1 point lost per second taken, but don't drop below 10 points per correct answer
        const timePenalty = timeTakenSeconds;
        const minPoints = newlyCorrectCount * 10;
        
        const earned = Math.max(minPoints, basePoints - timePenalty);
        
        earnedPointsText = `${earned} points earned (Time: ${timeTakenSeconds}s)`;

        // Update DB
        const { error: ptsError } = await _supabase.rpc('increment_points', {
            row_id: userId,
            amount: earned
        });
        
        if (!ptsError) {
          sessionPoints += earned;
          headerPoints.textContent = `${sessionPoints} pts`;
        }
        
        // Reset newlyCorrectCount so it doesn't double-award
        newlyCorrectCount = 0; 
    } else {
        earnedPointsText = `Already completed / 0 new points`;
    }

    document.getElementById('question-card').innerHTML = `
      <div class="text-center py-8">
        <span class="material-symbols-outlined text-7xl text-tertiary-container mb-4 block" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
        <h2 class="font-display-lg text-display-lg text-on-surface mb-4">Quiz Complete!</h2>
        <p class="font-title-md text-title-md text-on-surface-variant mb-2">You got ${correct} out of ${total} correct</p>
        <div class="inline-flex flex-col items-center gap-2 bg-secondary-container text-on-secondary-container px-6 py-3 rounded-2xl mt-4">
          <div class="flex items-center gap-2 font-headline-lg text-headline-lg">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">stars</span>
            ${earnedPointsText}
          </div>
        </div>
      </div>
    `;

    progressLabel.textContent = `Complete!`;
    progressPercent.textContent = `100% Complete`;
    progressBar.style.width = '100%';

    checkBtn.textContent = 'BACK TO HOME';
    checkBtn.disabled = false;
    checkBtn.classList.remove('bg-tertiary-container', 'border-on-tertiary-container');
    checkBtn.classList.add('bg-primary-container', 'border-on-primary-container');
    checkBtn.style.boxShadow = '0 4px 0 0 #00405d';
    checkBtn.dataset.mode = 'home';
    checkBtn.addEventListener('click', () => {
      if (checkBtn.dataset.mode === 'home') {
        window.location.href = 'index.html';
      }
    }, { once: true });
  }
</script>
